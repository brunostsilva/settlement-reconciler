version: 2
updates:
  # build.sbt and project/plugins.sbt. Dependabot supports sbt version updates since May 2026.
  - package-ecosystem: sbt
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Pekko modules must share a version; Pekko HTTP has its own release line, so it's
      # grouped with them to be tested together.
      pekko:
        patterns: ["org.apache.pekko:*"]
      circe:
        patterns: ["io.circe:*"]
      # Everything else: minor/patch bumps in one weekly PR.
      sbt-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
