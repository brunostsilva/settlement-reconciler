pekko {
  loglevel = INFO
  # Don't print the whole configuration or dead letters on shutdown: they add noise to the CLI output.
  log-dead-letters-during-shutdown = off

  # Pekko HTTP 2.0 caps a chunked request at 100,000 chunks. Clients often stream an upload in small
  # chunks (one per line, or per buffer), so a settlement file of a few MB already goes past it, and
  # it's checked by the connection's parser, before any route could lift it like the size limit. The
  # reconciliation route takes uploads of any size anyway, and parsing a chunk costs at least one byte
  # of upload, so lifting the count adds no work beyond what the size already allows.
  http.server.parsing.max-chunk-count = 2147483647
}
